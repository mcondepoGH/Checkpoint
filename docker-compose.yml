services:
  checkpoint:
    # latest = última versión estable. Alternativas: :beta (versiones preliminares) o :X.Y.Z (versión fija).
    image: ghcr.io/mcondepogh/checkpoint:latest
    container_name: checkpoint
    restart: unless-stopped
    ports:
      - "8088:8088"   # para otro puerto del equipo, cambia solo el primero (p. ej. "9000:8088")
    environment:
      # Obligatorias (definidas en .env). Las opcionales se añaden aquí; ver README.
      CHECKPOINT_USER: ${CHECKPOINT_USER:?define CHECKPOINT_USER en .env}
      CHECKPOINT_PASSWORD: ${CHECKPOINT_PASSWORD:?define CHECKPOINT_PASSWORD en .env}
      # Opcional: idioma por defecto de la interfaz ("es" o "en"). Sin marcar = español. Quien ya eligió idioma en su
      # navegador (selector de la cabecera) conserva su elección; "Automático" sigue el idioma del navegador.
      # CHECKPOINT_LANG: ${CHECKPOINT_LANG:-es}
    volumes:
      - ./config:/config
      - ./keys:/keys   # clave SSH (se genera sola) y known_hosts
      - ./data:/data   # copias, versiones y logs
