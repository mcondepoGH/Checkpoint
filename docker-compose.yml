services:
  checkpoint:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}   # uid/gid dueño de ./config, ./keys y ./data
        PGID: ${PGID:-1000}
    image: checkpoint:latest
    container_name: checkpoint
    restart: unless-stopped
    ports:
      - "${CHECKPOINT_PORT:-${SAVESYNC_PORT:-8088}}:8088"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      CHECKPOINT_USER: ${CHECKPOINT_USER:-${SAVESYNC_USER:?define CHECKPOINT_USER en .env}}
      CHECKPOINT_PASSWORD: ${CHECKPOINT_PASSWORD:-${SAVESYNC_PASSWORD:?define CHECKPOINT_PASSWORD en .env}}  # en claro; se hashea en memoria
      CHECKPOINT_SESSION_HOURS: ${CHECKPOINT_SESSION_HOURS:-${SAVESYNC_SESSION_HOURS:-12}}
      CHECKPOINT_COOKIE_SECURE: ${CHECKPOINT_COOKIE_SECURE:-${SAVESYNC_COOKIE_SECURE:-0}}   # 1 si accedes por HTTPS (proxy inverso)
      CHECKPOINT_TRUST_PROXY: ${CHECKPOINT_TRUST_PROXY:-${SAVESYNC_TRUST_PROXY:-0}}       # 1 si hay proxy inverso delante
      CHECKPOINT_AUTO_ENABLED: ${CHECKPOINT_AUTO_ENABLED:-${SAVESYNC_AUTO_ENABLED:-0}}     # sync automática: valor inicial (la UI prevalece)
      CHECKPOINT_AUTO_INTERVAL_HOURS: ${CHECKPOINT_AUTO_INTERVAL_HOURS:-${SAVESYNC_AUTO_INTERVAL_HOURS:-24}}
      CHECKPOINT_AUTO_RUN_ON_START: ${CHECKPOINT_AUTO_RUN_ON_START:-${SAVESYNC_AUTO_RUN_ON_START:-0}}
    volumes:
      - ./config:/config
      - ./keys:/keys           # id_ed25519 (se genera sola) + known_hosts (primer uso)
      - ./data:/data           # hub, versions, logs
