services:
  checkpoint:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}   # uid/gid dueño de ./config, ./keys y ./data
        PGID: ${PGID:-1000}
    # Para usar la imagen publicada en vez de construirla: quita `build` y pon image: ghcr.io/<owner>/checkpoint:latest
    image: checkpoint:latest
    container_name: checkpoint
    restart: unless-stopped
    ports:
      - "${CHECKPOINT_PORT:-8088}:8088"
    environment:
      TZ: ${TZ:-UTC}
      CHECKPOINT_USER: ${CHECKPOINT_USER:?define CHECKPOINT_USER en .env}
      CHECKPOINT_PASSWORD: ${CHECKPOINT_PASSWORD:?define CHECKPOINT_PASSWORD en .env}  # en claro; se hashea en memoria
      CHECKPOINT_SESSION_HOURS: ${CHECKPOINT_SESSION_HOURS:-12}
      CHECKPOINT_COOKIE_SECURE: ${CHECKPOINT_COOKIE_SECURE:-0}   # 1 si accedes por HTTPS (proxy inverso)
      CHECKPOINT_TRUST_PROXY: ${CHECKPOINT_TRUST_PROXY:-0}       # 1 si hay proxy inverso delante
    volumes:
      - ./config:/config
      - ./keys:/keys           # id_ed25519 (se genera sola) + known_hosts (primer uso)
      - ./data:/data           # hub, versions, logs
