devices:
  pc:   {host: 192.0.2.10, user: usuario, os: windows, port: 22}
  laptop: {host: 192.0.2.11, user: usuario, os: linux, port: 22}
games:
  ejemplo:
    devices: [pc, laptop]        # exactamente dos, distintos (la pantalla Configuración conserva estos comentarios al guardar)
    paths:
      pc: "C:/Users/usuario/AppData/Local/Ejemplo/Saves"
      laptop: "/home/usuario/.local/share/Ejemplo/Saves"
    process: "ejemplo.exe"     # opcional: no copiar si está abierto
    keep_versions: 5
