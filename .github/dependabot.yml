# npm y pip: mensual; las actualizaciones minor y patch van en un solo PR agrupado y cada major en su propio PR, salvo react con react-dom y vite con @vitejs/*, que llegan agrupados como majors porque son dependencias de pares acopladas (un PR suelto rompe `npm ci`). docker y github-actions: semanales y agrupados (en github-actions, con 7 días de espera tras publicarse cada versión, `upload-artifact` y `download-artifact` en su propio grupo y sin majors de ellos ni de `codeql-action`). Se ignoran los majors de eslint, @eslint/js, react y react-dom (ver `ignore`). Todos los PRs se revisan y fusionan a mano (sin auto-merge).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      react:
        patterns: ["react", "react-dom"]
        update-types: ["major"]
      vite:
        patterns: ["vite", "@vitejs/*"]
        update-types: ["major"]
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # eslint-plugin-jsx-a11y y eslint-plugin-react solo admiten eslint hasta la 9 en sus peers
      # (eslint 10 rompe `npm ci` con ERESOLVE). Revisar cuando ambos admitan eslint 10; al levantar
      # esta regla hay que adaptar `src/lib/clipboard.js` (línea 19, regla `no-useless-assignment` de eslint 10).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # React 19 añade ~80 KB al bundle propio y hace fallar `check:size` (presupuesto 363000 B, con
      # React 19 ~410000 B). Al levantar esta regla hay que subir el presupuesto en
      # `frontend/scripts/check-bundle-size.mjs` (y mirar los avisos de `npm audit` del grupo react).
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Espera de 7 días tras publicarse una versión. Para github-actions solo vale default-days
    # (las claves semver-*-days no se admiten en este ecosistema).
    cooldown:
      default-days: 7
    groups:
      # El par de artefactos sube junto (minor y patch); va antes del grupo comodín.
      artifact-pair:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
        update-types: ["minor", "patch"]
      github-actions:
        patterns: ["*"]
        exclude-patterns: ["actions/upload-artifact", "actions/download-artifact"]
    ignore:
      # upload-artifact y download-artifact: los majors se suben a mano, juntos, tras probar
      # que security-issues (workflow_run) sigue encontrando los artefactos.
      - dependency-name: "actions/upload-artifact"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/download-artifact"
        update-types: ["version-update:semver-major"]
      # trivy-action y codeql-action instalan o descargan binarios; solo entran los patch.
      # revisión manual: una acción compuesta con acciones anidadas ya falló por una dependencia retirada
      - dependency-name: "aquasecurity/trivy-action"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "aquasecurity/setup-trivy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "github/codeql-action"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
