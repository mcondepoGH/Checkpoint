name: CodeQL

# Análisis estático (SAST) con CodeQL. Gratis en repos públicos; en repos privados necesita
# GitHub Advanced Security. apply-templates.sh deja en la matriz solo los lenguajes detectados.
# Ajusta `branches` a tus ramas protegidas y el cron (cron no admite variables) si quieres
# otro día u hora; el minuto 17 evita la hora en punto, cuando GitHub va más cargado.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"   # semanal, lunes 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # subir los resultados a la pestaña Security
      actions: read            # lo pide codeql-action en repos privados
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
