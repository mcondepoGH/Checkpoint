name: Release

# Publica la imagen en GHCR y crea la GitHub Release al subir un tag vX.Y.Z[-sufijo].
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # crear la Release
  packages: write   # publicar en ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.v.outputs.image }}:v${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Comprobar que VERSION coincide con el tag
        id: v
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          if [ "$file" != "$version" ]; then
            echo "::error::VERSION ($file) no coincide con el tag $TAG (esperado $version). Actualiza VERSION, haz commit y vuelve a crear el tag."
            exit 1
          fi
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' <<<"$version"; then
            echo "::error::El tag $TAG no tiene formato vX.Y.Z[-sufijo]."
            exit 1
          fi
          # Con sufijo (-rc.1, -beta.2...) es pre-release.
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$version"
            echo "prerelease=$pre"
            echo "image=ghcr.io/${OWNER,,}/checkpoint"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=v${{ steps.v.outputs.version }}
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ steps.v.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ steps.v.outputs.prerelease == 'true' }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Baja siempre la base actual: evita reutilizar una capa de python:3.12-alpine obsoleta (y con CVE ya corregidos).
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo amd64. Para arm64 añade `docker/setup-qemu-action@v3` antes de buildx
          # y usa: platforms: linux/amd64,linux/arm64 (el build bajo QEMU es lento).
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crear la GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRE: ${{ steps.v.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes --title "$TAG")
          if [ "$PRE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}"

  # Escaneo informativo de la imagen ya publicada: no bloquea (exit-code 0) y deja el informe como
  # artefacto `trivy-report`, que security-issues convierte en issues con plazo. Si el escaneo falla,
  # la Release ya está creada (este job va después de `release`).
  trivy:
    needs: release
    permissions:
      contents: read
      packages: read   # la imagen de GHCR puede ser privada
    uses: ./.github/workflows/trivy-release.yml
    with:
      scan-type: image
      scan-ref: ${{ needs.release.outputs.image-ref }}
      ignore-unfixed: true   # los CVE sin corrección no abren issues
